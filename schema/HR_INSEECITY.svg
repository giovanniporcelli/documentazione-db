<text text-anchor="start" x="1121.71" y="-624.4" font-family="Arial" font-size="14.00" fill="#666666">[BASIC TABLE]</text>
<text text-anchor="start" x="445.02" y="-610" font-family="Arial" font-size="14.00" fill="#333333">INSEE City &#45; Contains the INSEE code. It is a numerical indexing code used by the French National Institute for Statistics and Economic Studies (INSEE) to identify various entities, including towns and regions.</text>
<polygon fill="none" stroke="black" points="46.2,-569.8 46.2,-600.6 2137.14,-600.6 2137.14,-569.8 46.2,-569.8"/>
<text text-anchor="start" x="53.2" y="-582" font-family="Arial" font-size="14.00">ID </text>
