<text text-anchor="start" x="112.34" y="-582" font-family="Arial" font-size="14.00"> Indicates the unique identifier</text>
<polygon fill="none" stroke="black" points="46.2,-539 46.2,-569.8 2137.14,-569.8 2137.14,-539 46.2,-539"/>
<text text-anchor="start" x="53.2" y="-551.2" font-family="Arial" font-size="14.00">INSEECODE </text>
<text text-anchor="start" x="139.55" y="-551.2" font-family="Arial" font-size="14.00" fill="#666666">[nvarchar(10)]</text>
<text text-anchor="start" x="226.7" y="-551.2" font-family="Arial" font-size="14.00"> The French INSEE code (or city code) is administratively called official geographic code. It applies to towns, townships, boroughs, counties, regions, and overseas territories.The INSEE code consists of 5 digits, the first 2 are the number of the French department and the other 3 are a code given to the town.</text>
<polygon fill="none" stroke="black" points="46.2,-508.2 46.2,-539 2137.14,-539 2137.14,-508.2 46.2,-508.2"/>
