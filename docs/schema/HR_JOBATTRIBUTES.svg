<text text-anchor="start" x="50.2" y="-576.2" font-family="Arial" font-size="14.00" fill="#333333">Job &#45; Contains a collection of information relating to a job. A job can be thought of as a template for a position. A position is an instance of a job. Jobs describe the nature of the work, whereas related positions represent the time, place, and organizational structure in which a person or persons actually perform the work. Positions usually have a specific budget associated with them.</text>
