<text text-anchor="start" x="53.2" y="-825.6" font-family="Arial" font-size="14.00" fill="#333333">Simulation Model &#45; &#160;&#160;A Simulation model includes all tools and best practices to manage a Simulation Scenario built on top of such model. For example, it defines how scenario participants will be initialised, which reporting dashboards will be used to analyse the “As Is” and “To Be” situations respectively, and which actions will allowed to plan participants hypothesis.</text>
